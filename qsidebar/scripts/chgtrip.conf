# chgtrip 充电口过流 / 过热保护
#
# 判定是「秒级 + 宽判定」：采样 INTERVAL 秒一次，连续 SAMPLES 次命中即跳闸。
# 跳闸后不会自动恢复，必须手动执行 `chg on`。
#
# 四个条件任一命中都跳闸（任一条件单独成立就足够危险）：
#   LIMIT_MA        净充电流上限   防电池被灌爆
#   LIMIT_PORT_MA   充电口协商电流 防接口 / 线材过流  ← 防 10A 的关键
#                   本机 DCP 最高档是 3.3A，所以取 3300 不会误跳；
#                   真插上 5A/10A 的违规供电时 TCPM 会协商到更高值，立刻抓住
#   LIMIT_TEMP      电池温度       防电池过热
#   LIMIT_PMIC_TEMP 充电 IC 温度   防 IC 过热
#
# GRACE: 每次开启充电后的宽限秒数，期间不判超限
#        （接通瞬间会有冲高，不宽限会误跳）

# ── 日常（推荐）───────────────────────────────────────────
LIMIT_MA=800
LIMIT_PORT_MA=3300
LIMIT_TEMP=45
LIMIT_PMIC_TEMP=60
SAMPLES=2
INTERVAL=1
GRACE=8

# ── 保守（怕误跳就放宽）───────────────────────────────────
# LIMIT_MA=1500
# LIMIT_PORT_MA=5000
# LIMIT_TEMP=50
# LIMIT_PMIC_TEMP=70

# ── 只防异常大电流 ───────────────────────────────────────
# LIMIT_MA=3300
# LIMIT_PORT_MA=5000
# LIMIT_TEMP=55
# LIMIT_PMIC_TEMP=80
