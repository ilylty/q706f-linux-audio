# chgtrip 配置 —— 只做电池满电截止
#
# 过流 / 过热保护不在这里做，理由见 chgtrip.sh 顶部注释。
# 简单说：内核已经把输入限流钉死在 1.5A（USB_ICL_HARD_LIMIT_UA），
# 插什么充电器都进不来更多，接口不会烧。软件再跳闸只会误杀。

# ── 满电截止（滞回式，像笔记本一样）─────────────────────
# 电量 >= STOP_AT 停止充电，掉到 <= RESUME_AT 自动恢复充电。
#
# 为什么用滞回而不是单门限：只在 95% 单向关断的话，电量掉到 94%
# 用户就会手动点开，充到 96% 又停，反复按压对电池更伤。
# 留 5% 间隔，充放都在一个周期内完成，不会来回抖动。
#
# 约束：RESUME_AT 必须小于 STOP_AT，脚本启动时会强制纠正。
STOP_AT=95
RESUME_AT=90

# 采样间隔（秒）。只看电量，不需要很密。
INTERVAL=5

# ── 其他预设 ─────────────────────────────────────────────
# 更保守（电池寿命优先，日常只充到 80%）
# STOP_AT=80
# RESUME_AT=75

# 更激进（尽量满电）
# STOP_AT=100
# RESUME_AT=92
