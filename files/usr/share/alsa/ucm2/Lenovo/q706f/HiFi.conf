# Lenovo Xiaoxin Pad Pro 12.6 (q706f) — 最简 UCM
# 不在这里设任何功放参数：cs35l45 的 pswitch 控件在 alsa-lib UCM cset 里会失败，
# 会导致整个 verb/device 不可用。功放配置由 q706f-audio.service 开机执行。
Syntax 3

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}
