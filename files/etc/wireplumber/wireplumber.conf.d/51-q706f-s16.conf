# q706f: CS35L45 / TDM 通路只接受 S16_LE，强制 pipewire 用 16 位
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = "FL,FR"
      }
    }
  }
]
