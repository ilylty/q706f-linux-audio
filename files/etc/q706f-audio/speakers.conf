# ============================================================
# Lenovo Xiaoxin Pad Pro 12.6 (q706f) — 扬声器配置
# 4x Cirrus CS35L45 + Synaptics AS33970
#
# 音量安全说明：
#   Analog PCM 范围 0-3 (10dB / 13dB / 16dB / 19dB)
#   Digital PCM 范围 0-457 (0=静音, 409=0dB, 457=+2dB)
#   原厂 UCM 用 Analog=3 / Digital=409（满功率）→ 电池 3.9V 时四喇叭
#   齐响会触发欠压保护直接黑屏死机，所以这里默认压到 Analog=1 / Digital=300
#
# 想调大：先把 Digital 一格一格加到 350、380，最后再动 Analog
# 想调小：只降 Digital 即可
# ============================================================

ANALOG=1          # 0..3  → 10/13/16/19 dB
DIGITAL=300       # 0..457 → 300 ≈ -27dB

# 4 个功放的 ASP 通道分配（来自上游 UCM，勿改）
#   SPK1/2 → DACPCM ASP_RX1，ASPRX1 slot 0 / ASPRX2 slot 1
#   SPK3/4 → DACPCM ASP_RX2，ASPRX1 slot 0 / ASPRX2 slot 2
